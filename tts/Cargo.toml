[package]
name = "tts"
version = "0.1.0"
edition = "2021"
description = "English text to speech with Kokoro-82M through ONNX Runtime"
authors = ["AI Robot Association (AIRoA) <ext-oss@airoa.org>"]
license = "Apache-2.0"
publish = false
repository = "https://github.com/airoa-org/yubi-go"

[dependencies]
serde_json = "1"
log = "0.4"
unicode-normalization = "0.1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23"] }
