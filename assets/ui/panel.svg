<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1160" viewBox="0 0 1024 1160">
<!--
  The in-headset panel's fixed parts, laid out where they draw. Open it in a
  browser to see the layout; every part shows at once, so states that never
  coexist overlap here.
    y    0..608   three camera cells (448x304 at (0,0), (512,0), (0,304))
    y  608..868   the centre surface: setup / calibration / refusals
    y  868..1160  the task band
  Each <g id> is one part that view::panel::ui places by id. Words, numbers,
  bars and thumbnails are drawn by Rust over and under these.
-->
<defs>
<g id="icon_alert" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"><path d="M12 2.8L22.4 21H1.6z"/>
  <path d="M12 9.5v4.5"/>
  <path d="M12 17.6v.1"/></g>
<g id="icon_angle" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"><path d="M14 24L5.5 4"/>
  <path d="M14 24L22.5 4"/>
  <path d="M8.9 12Q14 8.2 19.1 12"/></g>
<g id="icon_battery" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"><rect x="1.1" y="2.1" width="33" height="15.8" rx="2.5"/>
  <path d="M36.5 7h1.4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-1.4z" fill="currentColor" stroke="none"/></g>
<g id="icon_clock" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"><circle cx="14" cy="14" r="10.5"/>
  <path d="M14 8v6l4.5 3"/></g>
<g id="icon_cloud" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"><path d="M7.5 21.5a5.5 5.5 0 0 1-.6-11 7.5 7.5 0 0 1 14.3 2 4.75 4.75 0 0 1-1.2 9h-2"/>
  <path d="M14 25.5V13"/>
  <path d="M10 17l4-4 4 4"/></g>
<g id="icon_cloud_off" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"><path d="M8 20.5a5.5 5.5 0 0 1-1.1-10.9 7.5 7.5 0 0 1 13-3.4"/>
  <path d="M22.2 11.4a4.75 4.75 0 0 1-2.2 9.1H8"/>
  <path d="M3 3l22 22"/></g>
<g id="icon_disk" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"><ellipse cx="14" cy="6.5" rx="10.5" ry="4"/>
  <path d="M3.5 6.5v15c0 2.2 4.7 4 10.5 4s10.5-1.8 10.5-4v-15"/>
  <path d="M3.5 14c0 2.2 4.7 4 10.5 4s10.5-1.8 10.5-4"/></g>
<g id="icon_eye" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"><path d="M2 14s4.5-7.5 12-7.5S26 14 26 14s-4.5 7.5-12 7.5S2 14 2 14z"/>
  <circle cx="14" cy="14" r="3.6"/></g>
<g id="icon_ok" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/>
  <path d="M7.5 12.5l3 3 6-6.5"/></g>
<g id="icon_rec" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"><circle cx="12" cy="12" r="9" fill="currentColor" stroke="none"/></g>
<g id="icon_wifi_off" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor"><path d="M2 9.5a19 19 0 0 1 6-3.6"/>
  <path d="M26 9.5a19 19 0 0 0-11.6-4.4"/>
  <path d="M6.5 14.5a12.5 12.5 0 0 1 3.2-2.2"/>
  <path d="M21.5 14.5a12.5 12.5 0 0 0-4.4-2.6"/>
  <path d="M10.8 19.4a6 6 0 0 1 5-1"/>
  <path d="M14 24v.1"/>
  <path d="M2.5 2.5l23 23"/></g>
</defs>
<style>
  text { font-family: 'Noto Sans Mono','Noto Sans CJK JP'; font-size: 18px; white-space: pre; }
  .big { font-size: 36px; }
</style>

<!-- ======================= camera cells ============================== -->
<g id="c0_bars">
<rect x="0" y="0" width="448" height="26" fill="#101218" fill-opacity="0.85"/>
<rect x="0" y="278" width="448" height="26" fill="#101218" fill-opacity="0.85"/>
</g>
<g id="c0_nothumb"><rect x="0" y="26" width="448" height="252" fill="#101218" fill-opacity="0.85"/></g>
<g id="c0_wash"><rect x="0" y="26" width="448" height="252" fill="#eb3c3c" fill-opacity="0.7"/></g>

<g id="c1_bars">
<rect x="512" y="0" width="448" height="26" fill="#101218" fill-opacity="0.85"/>
<rect x="512" y="278" width="448" height="26" fill="#101218" fill-opacity="0.85"/>
</g>
<g id="c1_nothumb"><rect x="512" y="26" width="448" height="252" fill="#101218" fill-opacity="0.85"/></g>
<g id="c1_wash"><rect x="512" y="26" width="448" height="252" fill="#eb3c3c" fill-opacity="0.7"/></g>

<g id="c2_bars">
<rect x="0" y="304" width="448" height="26" fill="#101218" fill-opacity="0.85"/>
<rect x="0" y="582" width="448" height="26" fill="#101218" fill-opacity="0.85"/>
</g>
<g id="c2_nothumb"><rect x="0" y="330" width="448" height="252" fill="#101218" fill-opacity="0.85"/></g>
<g id="c2_wash"><rect x="0" y="330" width="448" height="252" fill="#eb3c3c" fill-opacity="0.7"/></g>

<g id="rec_failed">
<rect x="4" y="4" width="440" height="296" fill="none" stroke="#eb3c3c" stroke-width="8"/>
<rect x="516" y="4" width="440" height="296" fill="none" stroke="#eb3c3c" stroke-width="8"/>
<rect x="4" y="308" width="440" height="296" fill="none" stroke="#eb3c3c" stroke-width="8"/>
</g>

<!-- ======================= centre surface ============================ -->
<g id="centre_back"><rect x="12" y="608" width="1000" height="248" fill="#0c0e14"/></g>
<g id="refusal">
<rect x="12" y="608" width="1000" height="248" fill="#0c0e14"/>
<use href="#icon_alert" x="28" y="627" color="#eb3c3c"/>
</g>

<!-- ======================= task band ================================= -->
<g id="band">
<rect x="0" y="868" width="1024" height="126" fill="#0c0e14"/>
<rect x="0" y="998" width="260" height="114" fill="#0c0e14"/>
<rect x="272" y="998" width="272" height="114" fill="#0c0e14"/>
<rect x="556" y="998" width="468" height="114" fill="#0c0e14"/>
<rect x="0" y="1122" width="1024" height="38" fill="#0c0e14"/>
</g>
<g id="rec">
<use href="#icon_rec" x="896" y="874" color="#eb3c3c"/>
</g>
</svg>
